<section class="contacto-page">
    <h2>Ponte en contacto con nosotros</h2>
    
    <div class="contacto-container">
        <!-- Lado Izquierdo: Formulario -->
        <div class="col-formulario">
            <form class="form-contacto">
                <input type="text" placeholder="Nombre completo" required>
                <input type="email" placeholder="Correo electrónico" required>
                <input type="tel" placeholder="Teléfono" required>
                <input type="text" placeholder="Asunto" required>
                <textarea placeholder="Mensaje" required></textarea>
                
                <div class="form-footer">
                    <button type="submit" class="btn-dark">Enviar mensaje</button>
                    
                    <div class="social-icons">
                        <a href="#">FACEBOOK</a>
                        <a href="#">INSTAGRAM</a>
                        <a href="#">TWITTER</a>
                    </div>
                </div>
            </form>
        </div>

        <!-- Lado Derecho: Información y Mapa -->
        <div class="contacto-info">
            <div class="info-item">
                <span></span> <strong>Teléfono:</strong>
                <p>+51 900 286 035</p>
            </div>
            <div class="info-item">
                <span></span> <strong>Email:</strong>
                <p>ventas@norcentro.com</p>
            </div>
            <div class="info-item">
                <span></span> <strong>Dirección:</strong>
                <p>Av. Pakamuros 530, Jaén 06801</p>
            </div>
            <div class="info-item">
                <span></span> <strong>Horario:</strong>
                <p>Lunes a Sábado: 9:00 AM - 7:00 PM</p>
            </div>

            <div class="mapa-referencia">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3962.247656648719!2d-78.805531!3d-5.7105!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91b4fb7b4255d557%3A0x73601a61da582f0e!2sAv.%20Pakamuros%20530%2C%20Ja%C3%A9n%2006801!5e0!3m2!1ses!2spe!4v1715634567890!5m2!1ses!2spe"
                    allowfullscreen="" loading="lazy">
                </iframe>
            </div>
        </div>
